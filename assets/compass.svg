<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tenerife Compass">
  <circle cx="32" cy="32" r="30" fill="#0a7ea4"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#08536b" stroke-width="2"/>
  <circle cx="32" cy="32" r="23" fill="none" stroke="#eaf6fa" stroke-width="1.5" opacity="0.5"/>
  <!-- Compass rose: north = coral, south = sand -->
  <polygon points="32,8 38,32 32,32" fill="#ff6b4a"/>
  <polygon points="32,8 26,32 32,32" fill="#e8542f"/>
  <polygon points="32,56 38,32 32,32" fill="#fbf6ee"/>
  <polygon points="32,56 26,32 32,32" fill="#d9cdb4"/>
  <polygon points="8,32 32,38 32,32" fill="#f6a821"/>
  <polygon points="8,32 32,26 32,32" fill="#d78e13"/>
  <polygon points="56,32 32,38 32,32" fill="#f6a821"/>
  <polygon points="56,32 32,26 32,32" fill="#d78e13"/>
  <circle cx="32" cy="32" r="3.5" fill="#fff"/>
</svg>
